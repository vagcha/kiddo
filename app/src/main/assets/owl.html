<!doctype html>
<html lang="el">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 35%, #fff6d8 0%, #ffd27a 55%, #ff9f5a 100%); overflow: hidden; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
</style>

<body>

  camera-controls touch-action="none" auto-rotate auto-rotate-delay="0" rotation-per-second="25deg"
  shadow-intensity="1" exposure="1.05" environment-image="neutral" interaction-prompt="none">
</model-viewer>
</body>
</html>
