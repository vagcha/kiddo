<title>Kiddo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Manrope:wght@500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer-umd.min.js"></script>
<style>
/* Layout: one-screen app column (max 560px) — header, play area, controls; single bright "sunny playroom" look in every theme */
:root {
  --sky: #bfe6ff;
  --cream: #fff8ec;
  --ink: #2b2140;
  --ink-soft: #5d5470;
  --card: #ffffff;
  --orange: #ff8a00;
  --teal: #1ba39c;
  --purple: #8e44ec;
  --pink: #ff5c8a;
  --blue: #3d8bff;
  --green: #2fae52;
  --yellow: #ffc928;
  --red: #f2453d;
  --line: #e7e0f0;
  --font-display: "Comfortaa", "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 22px;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
#app { height: 100%; display: flex; justify-content: center; }
.view {
  width: 100%; max-width: 560px; height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  gap: 10px; min-height: 0;
  animation: fadein .25s ease;
}
@keyframes fadein { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bgwrap { position: fixed; inset: 0; z-index: -1; background: var(--cream); }
.bgwrap.tinted { background: linear-gradient(180deg, var(--tint, var(--sky)) 0%, var(--cream) 60%); }
.bgwrap img { width: 100%; height: 100%; object-fit: cover; max-width: none; }

/* header */
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 6vw, 30px); text-wrap: balance; }
.round {
  width: 50px; height: 50px; border-radius: 50%; flex: none;
  display: grid; place-items: center; color: #fff; font-size: 24px; font-weight: 800;
  background: var(--c, var(--orange)); box-shadow: 0 4px 0 rgba(0,0,0,.15);
  transition: transform .1s;
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.round svg { width: 26px; height: 26px; fill: currentColor; }
.stars { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 0 var(--line); }
.stars span:first-child { color: var(--yellow); font-size: 20px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 60px; padding: 0 16px; border-radius: var(--radius);
  background: var(--c, var(--orange)); color: #fff;
  font-weight: 800; font-size: 20px; text-align: center;
  box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .1s, background .2s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.fill { flex: 1; min-height: 0; }
.center { text-align: center; }
.muted { color: var(--ink-soft); font-weight: 700; }
.prompt { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 6vw, 28px); text-align: center; margin: 0; text-wrap: balance; }

/* home */
.hello { display: flex; align-items: center; gap: 8px; }
.mascot { width: 110px; flex: none; animation: bob 1.4s ease-in-out infinite; cursor: pointer; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
.bubble { background: rgba(255,255,255,.93); border-radius: 22px; padding: 12px 14px; font-weight: 800; font-size: 18px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 38px; color: var(--orange); margin: 0; flex: 1; letter-spacing: .5px; }
.age { display: inline-flex; align-self: flex-start; align-items: center; background: rgba(255,255,255,.88); border-radius: 999px; padding: 4px; font-weight: 800; }
.age > span { padding: 0 10px; }
.age button { padding: 8px 16px; border-radius: 999px; font-weight: 800; }
.age button[aria-pressed="true"] { background: var(--orange); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; overflow-y: auto; padding: 2px 2px 8px; align-content: start; }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card {
  background: rgba(255,255,255,.95); border-radius: 24px; padding: 8px 8px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 5px 0 rgba(0,0,0,.08); transition: transform .12s;
}
.card:active { transform: scale(.96); }
.card .pic { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 18px; background: color-mix(in srgb, var(--c) 18%, white); display: grid; place-items: center; }
.card .pic img { width: 86%; height: 86%; object-fit: contain; }
.card b { font-family: var(--font-display); font-size: 17px; color: var(--c); }

/* surfaces */
.panel { background: var(--card); border-radius: 26px; box-shadow: 0 6px 0 rgba(0,0,0,.07); overflow: hidden; position: relative; }
canvas { display: block; touch-action: none; }
.swatches { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; }
.sw { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { transform: scale(1.15); box-shadow: 0 0 0 3px var(--ink); }
.tools { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tool[aria-pressed="false"] { --c: #c9c3d3 !important; }
.size { width: 46px; height: 46px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 0 var(--line); }
.size i { display: block; border-radius: 50%; background: var(--ink); }
.size[aria-pressed="true"] { background: var(--yellow); }
.stickers { display: flex; gap: 8px; overflow-x: auto; padding: 2px; }
.stk { width: 54px; height: 54px; flex: none; border-radius: 14px; background: #fff; padding: 3px; box-shadow: 0 2px 0 var(--line); }
.stk[aria-pressed="true"] { background: var(--yellow); }
.stk img { width: 100%; height: 100%; object-fit: contain; }

/* list pickers */
.pick { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow-y: auto; align-content: start; padding: 2px; }
.pick.one { grid-template-columns: 1fr; }
.tile { border-radius: 24px; overflow: hidden; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.08); position: relative; aspect-ratio: 1; }
.tile.wide { aspect-ratio: 16 / 7; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile.line img { object-fit: contain; padding: 8px; }
.tile .label { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.92); border-radius: 14px; padding: 6px 12px; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--c, var(--green)); }
.cat { min-height: 92px; border-radius: 26px; background: var(--c); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 22px; font-family: var(--font-display); font-weight: 700; font-size: 28px; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
.cat .em { font-size: 44px; }

/* music */
.songs { display: flex; gap: 8px; }
.songs button { flex: 1; min-width: 0; padding: 10px 6px; border-radius: 16px; background: #fff; font-weight: 800; font-size: 14px; box-shadow: 0 2px 0 var(--line); }
.songs button[aria-pressed="true"] { background: var(--purple); color: #fff; }
.xylo { display: flex; flex-direction: column; gap: 7px; align-items: center; }
.bar {
  flex: 1; min-height: 34px; border-radius: 14px; background: var(--c); color: #fff;
  display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
  font-family: var(--font-display); font-weight: 700; font-size: 20px;
  box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .08s, background .12s, color .12s;
}
.bar::before, .bar::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: rgba(0,0,0,.3); }
.bar.lit, .bar.hint { background: #fff; color: var(--c); }
.bar.lit { transform: scale(.95); }
.bar.hint { animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { background: var(--c); color: #fff; } }

/* quiz / numbers */
.progress { height: 14px; background: #fff; border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--c); border-radius: 999px; transition: width .3s; }
.visual { display: grid; place-items: center; }
.visual img { max-height: 100%; max-width: 70%; object-fit: contain; }
.bigtext { background: #fff; border-radius: 28px; padding: 14px 26px; font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 11vw, 52px); text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.08); letter-spacing: 2px; }
.swatchbig { width: min(46vw, 180px); aspect-ratio: 1; max-width: 100%; border-radius: 36px; border: 6px solid #ddd; }
.answers { display: grid; gap: 10px; }
.answers .btn { font-size: 24px; }
.btn.right { --c: var(--green) !important; }
.btn.wrong { --c: var(--red) !important; animation: shake .35s; }
.btn.off { --c: #cfc9d8 !important; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.groups { display: flex; flex-direction: column; gap: 8px; }
.group { flex: 1; min-height: 0; background: rgba(255,255,255,.85); border-radius: 22px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px; padding: 6px; }
.critter { width: var(--s, 58px); height: var(--s, 58px); position: relative; transition: transform .15s; }
.critter img { width: 100%; height: 100%; object-fit: contain; }
.critter.on { transform: scale(1.12); }
.critter em { position: absolute; top: 0; right: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; font-style: normal; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.nums .btn { aspect-ratio: 1.3; font-size: 40px; font-family: var(--font-display); }

/* puzzle */
.board { display: grid; gap: 3px; padding: 4px; background: #fff; border-radius: 20px; aspect-ratio: 1; width: 100%; max-width: 100%; margin: 0 auto; }
.piece { border-radius: 7px; background-repeat: no-repeat; transition: transform .12s; }
.piece.sel { transform: scale(.9); outline: 4px solid var(--yellow); }
.board.peek { background-size: cover; }

/* memory */
.mem { display: grid; gap: 10px; }
.mcard { perspective: 700px; width: 100%; height: 100%; padding: 0; min-height: 0; }
.mcard .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.up .in { transform: rotateY(180deg); }
.mcard .face, .mcard .back { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
.mcard .back { background: linear-gradient(135deg, var(--teal), var(--blue)); font-size: 38px; }
.mcard .face { background: #fff; transform: rotateY(180deg); padding: 6px; }
.mcard.done .face { background: #dff7e3; }
.mcard .face img { width: 100%; height: 100%; object-fit: contain; }

/* intro */
.intro { background: linear-gradient(180deg, #1b1035, #3a1f5d); }
.intro .view { justify-content: space-evenly; align-items: center; }
.intro h1 { color: var(--yellow); font-family: var(--font-display); font-size: clamp(28px, 8vw, 38px); text-align: center; margin: 0; text-wrap: balance; }
.intro video { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 36px; object-fit: cover; background: #000; }

model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 35%, #fff6d8 0%, #ffd27a 55%, #ff9f5a 100%); --poster-color: transparent; }

/* celebration */
.overlay { position: fixed; inset: 0; background: rgba(20,10,40,.5); display: grid; place-items: center; z-index: 50; padding: 20px; }
.overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.win { position: relative; background: #fff; border-radius: 32px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 380px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.25); animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.win img { width: 140px; animation: bob 1.4s ease-in-out infinite; }
.win h2 { margin: 0; font-family: var(--font-display); color: var(--orange); font-size: 26px; text-align: center; text-wrap: balance; }
.win .s3 { font-size: 46px; letter-spacing: 4px; color: var(--yellow); }
.win .s3 .off { color: #e2e2e2; }
.win .row { width: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="bgwrap" id="bg"></div>
<div id="app"></div>

<script>
(() => {
"use strict";

/* ---------- small helpers ---------- */
const $app = document.getElementById("app");
const $bg = document.getElementById("bg");
const A = (f) => "assets/" + f;
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(k));
  return el;
}
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const ICON = {
  back: '<svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4-1.8 1.8L4.4 12l9.2-9.2z"/></svg>',
  speak: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  note: '<svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>',
  noteoff: '<svg viewBox="0 0 24 24"><path d="M3.3 2 2 3.3l10 10V13.6A4 4 0 1 0 14 17v-1.7l6.7 6.7L22 20.7 3.3 2zM14 7h4V3h-6v5.2l2 2V7z"/></svg>',
  undo: '<svg viewBox="0 0 24 24"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 20.2 16l2.4-.8A10.5 10.5 0 0 0 12.5 8z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  brush: '<svg viewBox="0 0 24 24"><path d="M7 14a3 3 0 0 0-3 3c0 1.3-1.2 2-2 2 .9 1.2 2.5 2 4 2a4 4 0 0 0 4-4 3 3 0 0 0-3-3zm13.7-9.6-1.4-1.3a1 1 0 0 0-1.4 0L9 12l2.8 2.8 8.9-8.9a1 1 0 0 0 0-1.5z"/></svg>',
  eraser: '<svg viewBox="0 0 24 24"><path d="m16.2 3.6 5.6 5.6a2 2 0 0 1 0 2.8L13 20.8h7v2H8l-5.4-5.4a2 2 0 0 1 0-2.8L13.4 3.6a2 2 0 0 1 2.8 0zM4 16l4.8 4.8h1.4L15 16l-5.6-5.6L4 16z"/></svg>',
  reset: '<svg viewBox="0 0 24 24"><path d="M17.7 6.3A8 8 0 1 0 19.7 14h-2.1A6 6 0 1 1 12 6c1.7 0 3.1.7 4.2 1.8L13 11h7V4l-2.3 2.3z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
};
const iconBtn = (name, color, onclick, label, size) => {
  const b = h("button", { class: "round", style: `--c:${color};${size ? `width:${size}px;height:${size}px` : ""}`, onclick, "aria-label": label });
  b.innerHTML = ICON[name];
  return b;
};

/* ---------- persisted state (per browser) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("kiddo." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kiddo." + k, JSON.stringify(v)); } catch {} },
};
const S = { stars: store.get("stars", 0), older: store.get("older", false), music: store.get("music", true) };
function addStars(n) { S.stars += n; store.set("stars", S.stars); document.querySelectorAll(".stars b").forEach((b) => (b.textContent = S.stars)); }

/* ---------- sound: tiny Web Audio synth ---------- */
let ctx = null;
function audio() {
  if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
const N = { C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5 };
function note(freq, dur = 0.9, when = 0) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + when;
  const out = c.createGain(); out.connect(c.destination);
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.35, t + 0.005);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[1, 1], [3, 0.3], [4.2, 0.12]].forEach(([m, g], i) => {
    const o = c.createOscillator(); const gg = c.createGain();
    o.type = "sine"; o.frequency.value = freq * m;
    gg.gain.setValueAtTime(g, t); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur / (1 + i * 2));
    o.connect(gg).connect(out); o.start(t); o.stop(t + dur + 0.05);
  });
}
const seq = (fs, gap, dur = 0.5) => fs.forEach((f, i) => note(f, dur, i * gap));
const sfx = {
  pop: () => note(N.G5 * 1.5, 0.2),
  ok: () => seq([N.C5, N.E5, N.G5, N.C6], 0.09, 0.4),
  no: () => seq([330, 262], 0.16, 0.35),
  win: () => seq([N.C5, N.E5, N.G5, N.C6, N.G5, N.C6], 0.13, 0.5),
};

/* background music (Artlist track) */
const bgm = new Audio(A("bg_music.mp3"));
bgm.loop = true; bgm.volume = 0.3;
let started = false;
function syncMusic(route) {
  const want = started && S.music && route !== "music" && route !== "intro";
  if (want && bgm.paused) bgm.play().catch(() => {});
  if (!want && !bgm.paused) bgm.pause();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) bgm.pause(); else syncMusic(current); });

/* Greek speech */
let voice = null;
function pickVoice() {
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voice = vs.find((v) => /^el/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!started || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "el-GR"; if (voice) u.voice = voice;
    u.rate = 0.92; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch {}
}
const hush = () => { try { window.speechSynthesis && speechSynthesis.cancel(); } catch {} };

/* ---------- shared content ---------- */
const ANIMALS = [
  { name: "Γάτα", img: "animal_cat.webp", sound: "Νιάου" },
  { name: "Σκύλος", img: "animal_dog.webp", sound: "Γαβ γαβ" },
  { name: "Ελέφαντας", img: "animal_elephant.webp", sound: "Πρρρου" },
  { name: "Λιοντάρι", img: "animal_lion.webp", sound: "Γρρρ" },
  { name: "Βάτραχος", img: "animal_frog.webp", sound: "Κουάξ" },

/* ---------- quiz ---------- */
function choice(prompt, correct, pool, count = 3, extra = {}) {
  const wrong = shuffle([...new Set(pool.filter((p) => p !== correct))]).slice(0, count - 1);
  const options = shuffle([...wrong, correct]);
  return { prompt, options, answer: options.indexOf(correct), speech: prompt, ...extra };
}
function mathQ(older) {
  if (!older) { const a = rnd(0, 5), b = rnd(0, 5); return choice("Πόσο κάνει;", String(a + b), Array.from({ length: 11 }, (_, i) => String(i)), 3, { big: `${a} + ${b} = ?`, speech: `Πόσο κάνει ${NUM[a]} συν ${NUM[b]};` }); }
  const k = rnd(0, 2);
  if (k === 0) { const a = rnd(10, 59), b = rnd(5, 39), r = a + b; return choice("Πόσο κάνει;", String(r), [r - 10, r - 1, r + 1, r + 10, r + 2].map(String), 3, { big: `${a} + ${b} = ?`, speech: `Πόσο κάνει ${a} συν ${b};` }); }
  if (k === 1) { const a = rnd(20, 98), b = rnd(5, a - 1), r = a - b; return choice("Πόσο κάνει;", String(r), [r - 10, r - 1, r + 1, r + 10, r + 2].filter((x) => x >= 0).map(String), 3, { big: `${a} − ${b} = ?`, speech: `Πόσο κάνει ${a} μείον ${b};` }); }
  const a = rnd(2, 10), b = rnd(2, 10), r = a * b; return choice("Πόσο κάνει;", String(r), [r - a, r + a, r - b, r + b, r + 1].map(String), 3, { big: `${a} × ${b} = ?`, speech: `Πόσο κάνει ${a} επί ${b};` });
}
function animalQ(older) {
  const a = pickOne(ANIMALS), names = ANIMALS.map((x) => x.name);
  if (!older || Math.random() < 0.5) return choice("Ποιο ζωάκι είναι αυτό;", a.name, names, 3, { img: a.img });
  return choice(`Ποιο ζωάκι λέει «${a.sound}»;`, a.name, names, 4, { big: `«${a.sound}!»`, speech: `Ποιο ζωάκι λέει ${a.sound};` });
}
const COLORS = [["Κόκκινο", "#e53935"], ["Μπλε", "#1e5bff"], ["Πράσινο", "#2ead4b"], ["Κίτρινο", "#ffd600"], ["Πορτοκαλί", "#ff8a00"], ["Μωβ", "#8e44ec"], ["Ροζ", "#ff7eb3"], ["Καφέ", "#8d5524"], ["Μαύρο", "#111111"], ["Άσπρο", "#ffffff"], ["Γκρι", "#9e9e9e"]];
const MIXES = [["Κόκκινο", "Κίτρινο", "Πορτοκαλί"], ["Μπλε", "Κίτρινο", "Πράσινο"], ["Κόκκινο", "Μπλε", "Μωβ"], ["Κόκκινο", "Άσπρο", "Ροζ"], ["Μαύρο", "Άσπρο", "Γκρι"]];
function colorQ(older) {
  const names = COLORS.map((c) => c[0]);
  if (older && Math.random() < 0.5) { const [a, b, r] = pickOne(MIXES); return choice(`Αν ανακατέψω ${a} και ${b}, τι χρώμα βγαίνει;`, r, names, 4, { big: `${a} + ${b} = ?` }); }
  const [n, c] = pickOne(COLORS); return choice("Τι χρώμα είναι αυτό;", n, names, older ? 4 : 3, { swatch: c });
}
const WORDS = [["ΓΑΤΑ", "", "animal_cat.webp"], ["ΣΚΥΛΟΣ", "", "animal_dog.webp"], ["ΕΛΕΦΑΝΤΑΣ", "", "animal_elephant.webp"], ["ΛΙΟΝΤΑΡΙ", "", "animal_lion.webp"], ["ΒΑΤΡΑΧΟΣ", "", "animal_frog.webp"], ["ΓΟΥΡΟΥΝΙ", "", "animal_pig.webp"],
  ["ΜΗΛΟ", "🍎"], ["ΗΛΙΟΣ", "☀️"], ["ΨΑΡΙ", "🐟"], ["ΣΠΙΤΙ", "🏠"], ["ΔΕΝΤΡΟ", "🌳"], ["ΑΣΤΕΡΙ", "⭐"], ["ΜΕΛΙΣΣΑ", "🐝"], ["ΧΕΛΩΝΑ", "🐢"], ["ΜΠΑΛΑ", "⚽"], ["ΦΕΓΓΑΡΙ", "🌙"], ["ΚΑΡΔΙΑ", "❤️"], ["ΠΑΠΑΚΙ", "🦆"], ["ΤΡΕΝΟ", "🚂"], ["ΟΜΠΡΕΛΑ", "☂️"], ["ΝΕΡΟ", "💧"], ["ΖΑΧΑΡΗ", "🍬"]];
const ABC = [..."ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ"];
function letterQ(older) {
  const [w, em, img] = pickOne(WORDS);
  if (!older) return choice("Από ποιο γράμμα αρχίζει;", w[0], ABC, 3, { img, big: img ? null : em, speech: `Από ποιο γράμμα αρχίζει η λέξη ${w.toLowerCase()};` });
  const i = rnd(0, w.length - 1), shown = w.slice(0, i) + "_" + w.slice(i + 1);
  return choice("Ποιο γράμμα λείπει;", w[i], ABC, 4, { img, big: img ? shown : `${em}  ${shown}`, speech: "Ποιο γράμμα λείπει από τη λέξη;" });
}
const CATS = [["math", "Μαθηματικά", "➕", "var(--blue)", mathQ], ["animals", "Ζώα", "🐾", "var(--green)", animalQ], ["colors", "Χρώματα", "🎨", "var(--pink)", colorQ], ["letters", "Γράμματα", "🔤", "var(--orange)", letterQ]];
ROUTES.quiz = () => {
  const view = frame("Κουίζ", "var(--blue)", "Διάλεξε κουίζ!");
  say("Διάλεξε κουίζ!");
  view.append(h("div", { class: "pick one fill" }, CATS.map((c) => h("button", { class: "cat", style: `--c:${c[3]}`, onclick: () => { sfx.pop(); say(c[1]); quizRound(c); } }, h("span", { class: "em" }, c[2]), c[1]))));
};
function quizRound(cat) {
  const [, title, , color, gen] = cat, TOTAL = 8;
  const qs = []; while (qs.length < TOTAL) { const q = gen(S.older); const l = qs[qs.length - 1]; if (l && l.big === q.big && l.img === q.img && l.swatch === q.swatch) continue; qs.push(q); }
  let idx = 0, score = 0;
  function show() {
    const q = qs[idx];
    const view = frame(title, color, () => q.speech, () => ROUTES.quiz());
    let visual;
    if (q.img) visual = h("div", { style: "display:flex;flex-direction:column;align-items:center;height:100%;justify-content:center" }, h("img", { src: A(q.img), alt: "", style: "max-height:70%" }), q.big ? h("div", { class: "bigtext", style: "font-size:36px;padding:6px 18px" }, q.big) : null);
    else if (q.swatch) visual = h("div", { class: "swatchbig", style: `background:${q.swatch}` });
    else visual = h("div", { class: "bigtext" }, q.big);
    const btns = q.options.map((o, i) => h("button", { class: "btn", style: `--c:${color}`, onclick: () => answer(i) }, o));
    let done = false;
    async function answer(i) {
      if (done) return; done = true;
      const ok = i === q.answer;
      btns.forEach((b, k) => b.classList.add(k === q.answer ? "right" : k === i ? "wrong" : "off"));
      if (ok) { score++; sfx.ok(); say(pickOne(["Μπράβο!", "Σωστά!", "Τέλεια!", "Υπέροχα!"])); } else { sfx.no(); say(`Η σωστή απάντηση είναι ${q.options[q.answer]}`); }
      await sleep(ok ? 1300 : 2300);
      if (current !== "quiz") return;
      if (++idx >= qs.length) { addStars(starsFor(score, TOTAL)); celebrate(starsFor(score, TOTAL), `Βρήκες ${score} από ${TOTAL}!`, () => quizRound(cat)); }
      else show();
    }
    view.append(
      h("div", { class: "progress", style: `--c:${color}` }, h("i", { style: `width:${(idx / TOTAL) * 100}%` })),
      h("p", { class: "muted center", style: "margin:0" }, `Ερώτηση ${idx + 1} από ${TOTAL}`),
      h("p", { class: "prompt" }, q.prompt),
      h("div", { class: "visual fill" }, visual),
      h("div", { class: "answers" }, btns));
    say(q.speech);
  }
  show();
}

/* ---------- puzzle ---------- */
const PUZZLES = [["puzzle_farm.webp", "Φάρμα"], ["puzzle_ocean.webp", "Βυθός"], ["puzzle_space.webp", "Διάστημα"]];
ROUTES.puzzle = () => {
  const view = frame("Παζλ", "var(--green)", "Διάλεξε μια εικόνα για παζλ!");
  say("Διάλεξε μια εικόνα για παζλ!");
  view.append(h("div", { class: "pick one fill" }, PUZZLES.map(([f, n]) =>
    h("button", { class: "tile wide", "aria-label": n, onclick: () => { sfx.pop(); say(n); puzzleBoard(f); } }, h("img", { src: A(f), alt: "" }), h("span", { class: "label" }, n)))));
};
function puzzleBoard(file) {
  const n = S.older ? 4 : 3;
  const view = frame("Παζλ", "var(--green)", "Πάτα δύο κομμάτια για να αλλάξουν θέση!", () => ROUTES.puzzle());
  say("Πάτα δύο κομμάτια για να αλλάξουν θέση!");
  let tiles, sel = null, moves = 0, solved = false;
  do { tiles = shuffle([...Array(n * n).keys()]); } while (tiles.filter((t, i) => t === i).length > n);
  const counter = h("p", { class: "muted center", style: "margin:0" });
  const board = h("div", { class: "board", style: `grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)` });
  const pieces = tiles.map((_, pos) => {
    const p = h("button", { class: "piece", "aria-label": `Κομμάτι ${pos + 1}`, onclick: () => tapPiece(pos) });
    return p;
  });
  board.append(...pieces);
  function paint() {
    pieces.forEach((p, pos) => {
      const t = tiles[pos];
      p.style.backgroundImage = `url(${A(file)})`;
      p.style.backgroundSize = `${n * 100}% ${n * 100}%`;
      p.style.backgroundPosition = `${(t % n) / (n - 1) * 100}% ${Math.floor(t / n) / (n - 1) * 100}%`;
      p.classList.toggle("sel", sel === pos);
    });
    counter.textContent = `Κινήσεις: ${moves}`;
  }
  function tapPiece(pos) {
    if (solved) return;
    if (sel == null) { sel = pos; sfx.pop(); }
    else { if (sel !== pos) { [tiles[sel], tiles[pos]] = [tiles[pos], tiles[sel]]; moves++; (tiles[pos] === pos || tiles[sel] === sel) ? sfx.ok() : sfx.pop(); } sel = null; }
    paint();
    if (tiles.every((t, i) => t === i)) { solved = true; addStars(3); setTimeout(() => celebrate(3, `Μπράβο! Έλυσες το παζλ με ${moves} κινήσεις!`, () => puzzleBoard(file)), 400); }
  }
  const peek = h("button", { class: "btn", style: "--c:var(--blue);font-size:18px" }, "👀 Κράτα να δεις");
  const showFull = (on) => { board.style.backgroundImage = on ? `url(${A(file)})` : ""; board.classList.toggle("peek", on); pieces.forEach((p) => (p.style.visibility = on ? "hidden" : "")); };
  peek.addEventListener("pointerdown", () => showFull(true));
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => peek.addEventListener(ev, () => showFull(false)));
  view.append(counter, h("div", { class: "fill", style: "display:grid;place-items:center" }, h("div", { style: "width:min(100%, calc(100dvh - 260px));max-width:100%" }, board)),
    h("div", { class: "row" }, peek, h("button", { class: "btn", style: "--c:var(--orange);font-size:18px", onclick: () => puzzleBoard(file) }, "🔀 Ανακάτεμα")),
    h("p", { class: "muted center", style: "margin:0" }, `Επίπεδο: ${n} × ${n}`));
  paint();
}

/* ---------- memory ---------- */
ROUTES.memory = () => {
  const pairs = S.older ? 6 : 4, cols = S.older ? 3 : 2;
  const view = frame("Μνήμη", "var(--teal)", "Βρες τα ζευγάρια! Γύρνα δύο κάρτες.");
  say("Βρες τα ζευγάρια! Γύρνα δύο κάρτες.");
  const deck = shuffle(shuffle(ANIMALS).slice(0, pairs).flatMap((a) => [a, a]));
  let open = [], matched = 0, moves = 0, busy = false;
  const info = h("p", { class: "muted center", style: "margin:0" });
  const upd = () => (info.textContent = `Κινήσεις: ${moves} • Ζευγάρια: ${matched} / ${pairs}`);
  const cards = deck.map((a, i) => {
    const c = h("button", { class: "mcard", "aria-label": "Κάρτα", onclick: () => flip(i) },
      h("div", { class: "in" }, h("div", { class: "back" }, "⭐"), h("div", { class: "face" }, h("img", { src: A(a.img), alt: a.name }))));
    return c;
  });
  async function flip(i) {
    const c = cards[i];
    if (busy || c.classList.contains("up")) return;
    c.classList.add("up"); sfx.pop(); open.push(i);
    if (open.length < 2) return;
    busy = true; moves++;
    const [a, b] = open; open = [];
    if (deck[a] === deck[b]) {
      await sleep(350); sfx.ok(); say(deck[a].name);
      cards[a].classList.add("done"); cards[b].classList.add("done"); matched++;
      if (matched === pairs) { const s = moves <= pairs + 2 ? 3 : moves <= pairs * 2 ? 2 : 1; addStars(s); celebrate(s, `Τα βρήκες όλα με ${moves} κινήσεις!`, () => ROUTES.memory()); }
    } else { await sleep(1000); cards[a].classList.remove("up"); cards[b].classList.remove("up"); }
    busy = false; upd();
  }
  upd();
  view.append(info, h("div", { class: "mem fill", style: `grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${(pairs * 2) / cols},1fr)` }, cards),
    h("button", { class: "btn", style: "--c:var(--orange)", onclick: () => ROUTES.memory() }, "🔀 Νέο παιχνίδι"));
};

/* ---------- counting ---------- */
ROUTES.numbers = () => {
  const ROUNDS = 6; let round = 0, score = 0;
  function show() {
    const groups = S.older ? shuffle(ANIMALS).slice(0, 2).map((a) => [a, rnd(3, 10)]) : [[pickOne(ANIMALS), rnd(1, 10)]];
    const total = groups.reduce((s, g) => s + g[1], 0);
    const opts = shuffle([...shuffle([total - 2, total - 1, total + 1, total + 2].filter((x) => x > 0)).slice(0, 2), total]);
    const question = groups.length === 1 ? "Πόσα ζωάκια βλέπεις;" : "Πόσα είναι όλα μαζί;";
    const view = frame("Μετράμε", "var(--orange)", question);
    say(`${question} Πάτα τα για να τα μετρήσεις!`);
    let counted = 0, done = false;
    const size = S.older ? 48 : 60;
    const groupEls = groups.map(([a, k]) => h("div", { class: "group" }, Array.from({ length: k }, () => {
      const c = h("button", { class: "critter", style: `--s:${size}px`, "aria-label": a.name }, h("img", { src: A(a.img), alt: "" }));
      c.onclick = () => { if (c.classList.contains("on") || done) return; counted++; c.classList.add("on"); c.append(h("em", {}, String(counted))); note(N.C5 * (1 + counted * 0.06), 0.3); say(NUM[counted] || String(counted)); };
      return c;
    })));
    const btns = opts.map((o) => h("button", { class: "btn", style: "--c:var(--orange)", onclick: () => pick(o) }, String(o)));
    async function pick(o) {
      if (done) return; done = true;
      btns.forEach((b, i) => b.classList.add(opts[i] === total ? "right" : opts[i] === o ? "wrong" : "off"));
      if (o === total) { score++; sfx.ok(); say(`Μπράβο! Είναι ${NUM[total]}!`); } else { sfx.no(); say(`Όχι ακριβώς. Είναι ${NUM[total]}.`); }
      await sleep(2000);
      if (current !== "numbers") return;
      if (++round >= ROUNDS) { addStars(starsFor(score, ROUNDS)); celebrate(starsFor(score, ROUNDS), `Βρήκες ${score} από ${ROUNDS}!`, () => ROUTES.numbers()); }
      else show();
    }
    view.append(h("p", { class: "muted center", style: "margin:0" }, `Γύρος ${round + 1} από ${ROUNDS}`), h("p", { class: "prompt" }, question),
      h("div", { class: "groups fill" }, groupEls), h("div", { class: "nums" }, btns));
  }
  show();
};
