<title>Kiddo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Manrope:wght@500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer-umd.min.js"></script>
<style>
/* Layout: one-screen app column (max 560px) — header, play area, controls; single bright "sunny playroom" look in every theme */
:root {
  --sky: #bfe6ff;
  --cream: #fff8ec;
  --ink: #2b2140;
  --ink-soft: #5d5470;
  --card: #ffffff;
  --orange: #ff8a00;
  --teal: #1ba39c;
  --purple: #8e44ec;
  --pink: #ff5c8a;
  --blue: #3d8bff;
  --green: #2fae52;
  --yellow: #ffc928;
  --red: #f2453d;
  --line: #e7e0f0;
  --font-display: "Comfortaa", "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 22px;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
#app { height: 100%; display: flex; justify-content: center; }
.view {
  width: 100%; max-width: 560px; height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  gap: 10px; min-height: 0;
  animation: fadein .25s ease;
}
@keyframes fadein { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bgwrap { position: fixed; inset: 0; z-index: -1; background: var(--cream); }
.bgwrap.tinted { background: linear-gradient(180deg, var(--tint, var(--sky)) 0%, var(--cream) 60%); }
.bgwrap img { width: 100%; height: 100%; object-fit: cover; max-width: none; }

/* header */
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 6vw, 30px); text-wrap: balance; }
.round {
  width: 50px; height: 50px; border-radius: 50%; flex: none;
  display: grid; place-items: center; color: #fff; font-size: 24px; font-weight: 800;
  background: var(--c, var(--orange)); box-shadow: 0 4px 0 rgba(0,0,0,.15);
  transition: transform .1s;
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.round svg { width: 26px; height: 26px; fill: currentColor; }
.stars { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 0 var(--line); }
.stars span:first-child { color: var(--yellow); font-size: 20px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 60px; padding: 0 16px; border-radius: var(--radius);
  background: var(--c, var(--orange)); color: #fff;
  font-weight: 800; font-size: 20px; text-align: center;
  box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .1s, background .2s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.fill { flex: 1; min-height: 0; }
.center { text-align: center; }
.muted { color: var(--ink-soft); font-weight: 700; }
.prompt { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 6vw, 28px); text-align: center; margin: 0; text-wrap: balance; }

/* home */
.hello { display: flex; align-items: center; gap: 8px; }
.mascot { width: 110px; flex: none; animation: bob 1.4s ease-in-out infinite; cursor: pointer; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
.bubble { background: rgba(255,255,255,.93); border-radius: 22px; padding: 12px 14px; font-weight: 800; font-size: 18px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 38px; color: var(--orange); margin: 0; flex: 1; letter-spacing: .5px; }
.age { display: inline-flex; align-self: flex-start; align-items: center; background: rgba(255,255,255,.88); border-radius: 999px; padding: 4px; font-weight: 800; }
.age > span { padding: 0 10px; }
.age button { padding: 8px 16px; border-radius: 999px; font-weight: 800; }
.age button[aria-pressed="true"] { background: var(--orange); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; overflow-y: auto; padding: 2px 2px 8px; align-content: start; }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card {
  background: rgba(255,255,255,.95); border-radius: 24px; padding: 8px 8px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 5px 0 rgba(0,0,0,.08); transition: transform .12s;
}
.card:active { transform: scale(.96); }
.card .pic { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 18px; background: color-mix(in srgb, var(--c) 18%, white); display: grid; place-items: center; }
.card .pic img { width: 86%; height: 86%; object-fit: contain; }
.card b { font-family: var(--font-display); font-size: 17px; color: var(--c); }

/* surfaces */
.panel { background: var(--card); border-radius: 26px; box-shadow: 0 6px 0 rgba(0,0,0,.07); overflow: hidden; position: relative; }
canvas { display: block; touch-action: none; }
.swatches { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; }
.sw { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { transform: scale(1.15); box-shadow: 0 0 0 3px var(--ink); }
.tools { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tool[aria-pressed="false"] { --c: #c9c3d3 !important; }
.size { width: 46px; height: 46px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 0 var(--line); }
.size i { display: block; border-radius: 50%; background: var(--ink); }
.size[aria-pressed="true"] { background: var(--yellow); }
.stickers { display: flex; gap: 8px; overflow-x: auto; padding: 2px; }
.stk { width: 54px; height: 54px; flex: none; border-radius: 14px; background: #fff; padding: 3px; box-shadow: 0 2px 0 var(--line); }
.stk[aria-pressed="true"] { background: var(--yellow); }
.stk img { width: 100%; height: 100%; object-fit: contain; }

/* list pickers */
.pick { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow-y: auto; align-content: start; padding: 2px; }
.pick.one { grid-template-columns: 1fr; }
.tile { border-radius: 24px; overflow: hidden; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.08); position: relative; aspect-ratio: 1; }
.tile.wide { aspect-ratio: 16 / 7; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile.line img { object-fit: contain; padding: 8px; }
.tile .label { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.92); border-radius: 14px; padding: 6px 12px; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--c, var(--green)); }
.cat { min-height: 92px; border-radius: 26px; background: var(--c); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 22px; font-family: var(--font-display); font-weight: 700; font-size: 28px; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
.cat .em { font-size: 44px; }

/* music */
.songs { display: flex; gap: 8px; }
.songs button { flex: 1; min-width: 0; padding: 10px 6px; border-radius: 16px; background: #fff; font-weight: 800; font-size: 14px; box-shadow: 0 2px 0 var(--line); }
.songs button[aria-pressed="true"] { background: var(--purple); color: #fff; }
.xylo { display: flex; flex-direction: column; gap: 7px; align-items: center; }
.bar {
  flex: 1; min-height: 34px; border-radius: 14px; background: var(--c); color: #fff;
  display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
  font-family: var(--font-display); font-weight: 700; font-size: 20px;
  box-shadow: 0 5px 0 rgba(0,0,0,.18); transition: transform .08s, background .12s, color .12s;
}
.bar::before, .bar::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: rgba(0,0,0,.3); }
.bar.lit, .bar.hint { background: #fff; color: var(--c); }
.bar.lit { transform: scale(.95); }
.bar.hint { animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { background: var(--c); color: #fff; } }

/* quiz / numbers */
.progress { height: 14px; background: #fff; border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--c); border-radius: 999px; transition: width .3s; }
.visual { display: grid; place-items: center; }
.visual img { max-height: 100%; max-width: 70%; object-fit: contain; }
.bigtext { background: #fff; border-radius: 28px; padding: 14px 26px; font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 11vw, 52px); text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.08); letter-spacing: 2px; }
.swatchbig { width: min(46vw, 180px); aspect-ratio: 1; max-width: 100%; border-radius: 36px; border: 6px solid #ddd; }
.answers { display: grid; gap: 10px; }
.answers .btn { font-size: 24px; }
.btn.right { --c: var(--green) !important; }
.btn.wrong { --c: var(--red) !important; animation: shake .35s; }
.btn.off { --c: #cfc9d8 !important; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.groups { display: flex; flex-direction: column; gap: 8px; }
.group { flex: 1; min-height: 0; background: rgba(255,255,255,.85); border-radius: 22px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px; padding: 6px; }
.critter { width: var(--s, 58px); height: var(--s, 58px); position: relative; transition: transform .15s; }
.critter img { width: 100%; height: 100%; object-fit: contain; }
.critter.on { transform: scale(1.12); }
.critter em { position: absolute; top: 0; right: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; font-style: normal; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.nums .btn { aspect-ratio: 1.3; font-size: 40px; font-family: var(--font-display); }

/* puzzle */
.board { display: grid; gap: 3px; padding: 4px; background: #fff; border-radius: 20px; aspect-ratio: 1; width: 100%; max-width: 100%; margin: 0 auto; }
.piece { border-radius: 7px; background-repeat: no-repeat; transition: transform .12s; }
.piece.sel { transform: scale(.9); outline: 4px solid var(--yellow); }
.board.peek { background-size: cover; }

/* memory */
.mem { display: grid; gap: 10px; }
.mcard { perspective: 700px; width: 100%; height: 100%; padding: 0; min-height: 0; }
.mcard .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.up .in { transform: rotateY(180deg); }
.mcard .face, .mcard .back { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
.mcard .back { background: linear-gradient(135deg, var(--teal), var(--blue)); font-size: 38px; }
.mcard .face { background: #fff; transform: rotateY(180deg); padding: 6px; }
.mcard.done .face { background: #dff7e3; }
.mcard .face img { width: 100%; height: 100%; object-fit: contain; }

/* intro */
.intro { background: linear-gradient(180deg, #1b1035, #3a1f5d); }
.intro .view { justify-content: space-evenly; align-items: center; }
.intro h1 { color: var(--yellow); font-family: var(--font-display); font-size: clamp(28px, 8vw, 38px); text-align: center; margin: 0; text-wrap: balance; }
.intro video { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 36px; object-fit: cover; background: #000; }


.card .pic .emo { font-size: clamp(48px, 15vw, 72px); line-height: 1; }
/* quick games */
.hud { display: flex; gap: 10px; justify-content: center; }
.pill { background: #fff; border-radius: 999px; padding: 6px 16px; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 0 var(--line); min-width: 92px; text-align: center; }
.pill.low { background: var(--red); color: #fff; animation: blink .8s steps(2) infinite; --c: var(--red); }
.gamecard { border-radius: 26px; background: var(--c); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 14px 8px; box-shadow: 0 6px 0 rgba(0,0,0,.15); aspect-ratio: 1; }
.gamecard .em { font-size: clamp(48px, 15vw, 70px); line-height: 1.1; }
.gamecard b { font-family: var(--font-display); font-size: 19px; text-align: center; text-wrap: balance; }
.gamecard small { font-weight: 700; opacity: .9; }
.startcard { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.72); z-index: 5; padding: 18px; }
.startcard > div { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 340px; }
.startcard p { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; text-wrap: balance; }
.startcard .count { font-size: 96px; font-family: var(--font-display); color: var(--orange); }
.holes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px; align-content: center; height: 100%; }
.hole { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 50% 50% 18px 18px; overflow: hidden; background: radial-gradient(ellipse at 50% 92%, #5b3a1e 0 34%, transparent 35%), linear-gradient(#a8e07a, #7cc85a); }
.hole img { position: absolute; left: 12%; width: 76%; bottom: 6%; transform: translateY(110%); transition: transform .16s ease-out; }
.hole.up img { transform: translateY(0); }
.hole.hit img { transform: translateY(0) scale(1.15) rotate(-8deg); filter: brightness(1.2); }
.hole.miss { animation: shake .3s; }
.simon { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; aspect-ratio: 1; width: min(100%, calc(100dvh - 300px)); max-width: 100%; margin: 0 auto; }
.pad { border-radius: 30px; background: var(--c); opacity: .55; box-shadow: 0 6px 0 rgba(0,0,0,.18); transition: opacity .1s, transform .1s; font-size: 44px; }
.pad.lit { opacity: 1; transform: scale(1.04); box-shadow: 0 0 0 6px #fff, 0 0 30px var(--c); }

model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 35%, #fff6d8 0%, #ffd27a 55%, #ff9f5a 100%); --poster-color: transparent; }

/* celebration */
.overlay { position: fixed; inset: 0; background: rgba(20,10,40,.5); display: grid; place-items: center; z-index: 50; padding: 20px; }
.overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.win { position: relative; background: #fff; border-radius: 32px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 380px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.25); animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.win img { width: 140px; animation: bob 1.4s ease-in-out infinite; }
.win h2 { margin: 0; font-family: var(--font-display); color: var(--orange); font-size: 26px; text-align: center; text-wrap: balance; }
.win .s3 { font-size: 46px; letter-spacing: 4px; color: var(--yellow); }
.win .s3 .off { color: #e2e2e2; }
.win .row { width: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="bgwrap" id="bg"></div>
<div id="app"></div>

function choice(prompt, correct, pool, count = 3, extra = {}) {
  const wrong = shuffle([...new Set(pool.filter((p) => p !== correct))]).slice(0, count - 1);
  const options = shuffle([...wrong, correct]);
  return { prompt, options, answer: options.indexOf(correct), speech: prompt, ...extra };
}

function puzzleBoard(file) {

  const counter = h("p", { class: "muted center", style: "margin:0" });
  const board = h("div", { class: "board", style: `grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)` });

ROUTES.memory = () => {
  const pairs = S.older ? 6 : 4, cols = S.older ? 3 : 2;
  const view = frame("Μνήμη", "var(--teal)", "Βρες τα ζευγάρια! Γύρνα δύο κάρτες.");

  let open = [], matched = 0, moves = 0, busy = false;
  const info = h("p", { class: "muted center", style: "margin:0" });
  const upd = () => (info.textContent = `Κινήσεις: ${moves} • Ζευγάρια: ${matched} / ${pairs}`);
  const cards = deck.map((a, i) => {
    const c = h("button", { class: "mcard", "aria-label": "Κάρτα", onclick: () => flip(i) },

    const c = cards[i];

      cards[a].classList.add("done"); cards[b].classList.add("done"); matched++;

    } else { await sleep(1000); cards[a].classList.remove("up"); cards[b].classList.remove("up"); }
    busy = false; upd();
  }
  upd();
  view.append(info, h("div", { class: "mem fill", style: `grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${(pairs * 2) / cols},1fr)` }, cards),

/* Instruction card with a 3-2-1 countdown, then onStart(). */
function startCard(panel, text, onStart) {
  const btn = h("button", { class: "btn", style: "--c:var(--green);width:220px;font-size:24px" }, "Ξεκίνα!");
  const inner = h("div", {}, h("p", {}, text), btn);
  const card = h("div", { class: "startcard" }, inner);
  panel.append(card);
  say(text);
  btn.onclick = async () => {
    hush();
    for (const n of ["3", "2", "1"]) {
      inner.replaceChildren(h("div", { class: "count" }, n)); note(N.C5, 0.25); await sleep(650);
      if (!card.isConnected) return;
    }
    note(N.C6, 0.4); card.remove(); onStart();
  };
}
function countdown(seconds, hud, onEnd) {
  let left = seconds; hud.time(left);
  const id = setInterval(() => { left--; hud.time(left); if (left <= 5 && left > 0) note(N.G5, 0.12); if (left <= 0) { clearInterval(id); onEnd(); } }, 1000);
  onLeave(() => clearInterval(id));
}
function finishGame(game, score, t2, t3, msg) {
  const key = bestKey(game), best = store.get(key, 0), record = score > best;
  if (record) store.set(key, score);
  const stars = score >= t3 ? 3 : score >= t2 ? 2 : 1;
  addStars(stars);
  celebrate(stars, msg + (record && score > 0 ? " Νέο ρεκόρ!" : ""), () => ROUTES[game]());
}

  const cv = h("canvas"); panel.append(cv);
  const g = cv.getContext("2d"); const dim = { w: 0, h: 0 };
  const resize = () => { const d = window.devicePixelRatio || 1; dim.w = panel.clientWidth; dim.h = panel.clientHeight; cv.width = dim.w * d; cv.height = dim.h * d; cv.style.width = dim.w + "px"; cv.style.height = dim.h + "px"; g.setTransform(d, 0, 0, d, 0, 0); };
  const ro = new ResizeObserver(resize); ro.observe(panel); resize();
  let raf = 0, last = performance.now(), alive = true;
  const loop = (t) => { if (!alive) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; draw(g, dim, dt); raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  onLeave(() => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); });
  return { cv, dim };
}
function burst(parts, x, y, color) {
  for (let i = 0; i < 14; i++) { const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, c: color }); }
}
function drawParts(g, parts, dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    g.globalAlpha = Math.max(0, p.life / 0.6); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, 5, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

/* Balloons: pop the target colour (5–7) or the right answer (8–10) */
const BCOL = [["κόκκινες", "#f2453d"], ["μπλε", "#3d8bff"], ["κίτρινες", "#ffc928"], ["πράσινες", "#2fae52"], ["μωβ", "#8e44ec"]];
ROUTES.balloons = () => {
  const older = S.older;
  let target, score = 0, running = false, spawnT = 0, elapsed = 0, hits = 0;
  const balloons = [], parts = [];
  const view = frame("Φούσκες", "var(--red)", () => targetSpeech());
  const hud = gameHud(view); hud.time(45); hud.score(0);
  const banner = h("p", { class: "prompt" });
  const panel = h("div", { class: "panel fill", style: "background:linear-gradient(#bfe6ff,#fff8ec)" });
  view.append(banner, panel);
  function newTarget() {
    if (!older) { let t; do { t = rnd(0, BCOL.length - 1); } while (t === target); target = t; banner.innerHTML = ""; banner.append("Σπάσε τις ", h("span", { style: `color:${BCOL[t][1]};-webkit-text-stroke:1px #0002` }, BCOL[t][0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase()), "!"); }
    else {
      const k = rnd(0, 2); let a, b, ans, txt;
      if (k === 0) { a = rnd(2, 12); b = rnd(2, 12); ans = a + b; txt = `${a} + ${b}`; }
      else if (k === 1) { a = rnd(8, 20); b = rnd(1, a - 1); ans = a - b; txt = `${a} − ${b}`; }
      else { a = rnd(2, 6); b = rnd(2, 6); ans = a * b; txt = `${a} × ${b}`; }
      target = { ans, txt, a, b, k }; banner.textContent = `Βρες τη φούσκα: ${txt} = ?`;
    }
  }
  const targetSpeech = () => older ? `Σπάσε τη φούσκα με το αποτέλεσμα του ${target.a} ${["συν", "μείον", "επί"][target.k]} ${target.b}` : `Σπάσε τις ${BCOL[target][0]} φούσκες!`;
  newTarget();
  function spawn(dim) {
    const r = Math.max(26, Math.min(44, dim.w / 9));
    const b = { x: r + Math.random() * (dim.w - 2 * r), y: dim.h + r * 1.4, r, vy: (55 + Math.random() * 45) * (1 + elapsed / 45) * (older ? 1.2 : 1), wob: Math.random() * 6 };
    if (!older) b.c = Math.random() < 0.42 ? target : rnd(0, BCOL.length - 1);
    else { b.c = rnd(0, BCOL.length - 1); b.n = Math.random() < 0.38 ? target.ans : Math.max(0, target.ans + pickOne([-3, -2, -1, 1, 2, 3, 5])); }
    balloons.push(b);
  }
  const good = (b) => (older ? b.n === target.ans : b.c === target);
  const { cv } = gameCanvas(panel, (g, dim, dt) => {
    g.clearRect(0, 0, dim.w, dim.h);
    if (running) {
      elapsed += dt; spawnT -= dt;
      if (spawnT <= 0) { spawn(dim); spawnT = older ? 0.5 : 0.62; }
    }
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i]; b.y -= b.vy * dt; b.wob += dt * 2;
      if (b.y < -b.r * 2) { balloons.splice(i, 1); continue; }
      const x = b.x + Math.sin(b.wob) * 6, y = b.y, col = BCOL[b.c][1];
      g.strokeStyle = "#8a8199"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + b.r * 1.2); g.quadraticCurveTo(x + 8, y + b.r * 1.7, x, y + b.r * 2.2); g.stroke();
      g.fillStyle = col; g.beginPath(); g.moveTo(x - 6, y + b.r * 1.28); g.lineTo(x + 6, y + b.r * 1.28); g.lineTo(x, y + b.r * 1.14); g.fill();
      const gr = g.createRadialGradient(x - b.r * 0.35, y - b.r * 0.45, b.r * 0.1, x, y, b.r * 1.25);
      gr.addColorStop(0, "#ffffffcc"); gr.addColorStop(0.25, col); gr.addColorStop(1, col);
      g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, b.r, b.r * 1.2, 0, 0, 7); g.fill();
      if (b.n != null) { g.fillStyle = "#fff"; g.font = `800 ${Math.round(b.r * 0.85)}px Manrope, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.lineWidth = 4; g.strokeStyle = "#0004"; g.strokeText(b.n, x, y); g.fillText(b.n, x, y); }
      b.sx = x;
    }
    drawParts(g, parts, dt);
  });
  cv.addEventListener("pointerdown", (e) => {
    if (!running) return;
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i], dx = (px - b.sx) / b.r, dy = (py - b.y) / (b.r * 1.2);
      if (dx * dx + dy * dy <= 1.25) {
        balloons.splice(i, 1); burst(parts, b.sx, b.y, BCOL[b.c][1]); note(N.G5 * 1.5, 0.15);
        if (good(b)) { score++; hits++; hud.score(score); sfx.ok(); if (older || hits % 5 === 0) { newTarget(); say(older ? target.txt.replace("−", "μείον").replace("×", "επί").replace("+", "συν") : `Τώρα σπάσε τις ${BCOL[target][0]}!`); } }
        else sfx.no();
        return;
      }
    }
  });
  startCard(panel, older ? "Σπάσε τη φούσκα με το σωστό αποτέλεσμα! Έχεις 45 δευτερόλεπτα." : "Σπάσε τις φούσκες με το χρώμα που λέω! Έχεις 45 δευτερόλεπτα.", () => {
    running = true; say(targetSpeech());
    countdown(45, hud, () => { running = false; finishGame("balloons", score, 8, 15, `Έσπασες ${score} φούσκες!`); });
  });
};

/* Whack-an-animal: tap the animal you are asked for */
ROUTES.moles = () => {
  const older = S.older;
  let target = pickOne(ANIMALS), score = 0, running = false, hits = 0;
  const view = frame("Βρες το ζωάκι", "var(--green)", () => `Πάτα ${target.acc}!`);
  const hud = gameHud(view); hud.time(40); hud.score(0);
  const banner = h("p", { class: "prompt" });
  const holes = Array.from({ length: 9 }, (_, i) => {
    const img = h("img", { alt: "" });
    const hole = h("button", { class: "hole", "aria-label": `Τρύπα ${i + 1}` }, img);
    hole.state = null;
    hole.addEventListener("pointerdown", (e) => { e.preventDefault(); whack(hole); });
    return hole;
  });
  const panel = h("div", { class: "panel fill", style: "background:#d8f3c2" }, h("div", { class: "holes" }, holes));
  view.append(banner, panel);
  const setBanner = () => { banner.textContent = `Πάτα ${target.acc}!`; };
  setBanner();
  function whack(hole) {
    if (!running || !hole.state || hole.state.hit) return;
    if (hole.state.a === target) {
      score++; hits++; hud.score(score); sfx.ok(); hole.state.hit = true; hole.classList.add("hit");
      setTimeout(() => hide(hole), 250);
      if (hits % 3 === 0) { let t; do { t = pickOne(ANIMALS); } while (t === target); target = t; setBanner(); say(`Τώρα πάτα ${target.acc}!`); }
    } else { sfx.no(); hole.classList.add("miss"); setTimeout(() => hole.classList.remove("miss"), 300); }
  }
  function hide(hole) { hole.classList.remove("up", "hit"); hole.state = null; }
  let elapsed = 0;
  async function loop() {
    while (running) {
      const free = holes.filter((x) => !x.state);
      if (free.length) {
        const hole = pickOne(free), a = Math.random() < 0.45 ? target : pickOne(ANIMALS);
        hole.state = { a }; hole.querySelector("img").src = A(a.img); hole.querySelector("img").alt = a.name;
        requestAnimationFrame(() => hole.classList.add("up"));
        const stay = Math.max(older ? 650 : 950, (older ? 1150 : 1600) - elapsed * 15);
        setTimeout(() => { if (hole.state && hole.state.a === a && !hole.state.hit) hide(hole); }, stay);
      }
      const gap = Math.max(older ? 280 : 420, (older ? 650 : 900) - elapsed * 10);
      await sleep(gap); elapsed += gap / 1000;
    }
  }
  onLeave(() => { running = false; });
  startCard(panel, "Τα ζωάκια πετάγονται από τις τρύπες. Πάτα μόνο αυτό που σου λέω! Έχεις 40 δευτερόλεπτα.", () => {
    running = true; say(`Πάτα ${target.acc}!`); loop();
    countdown(40, hud, () => { running = false; holes.forEach(hide); finishGame("moles", score, 6, 12, `Βρήκες ${score} ζωάκια!`); });
  });
};

/* Catch the fruit with the basket (8–10: avoid the bees) */
const FRUITS = ["apple", "banana", "strawberry", "orange", "grapes", "watermelon", "pear", "cherries"].map((n) => { const i = new Image(); i.src = A(`fruit_${n}.webp`); return i; });
const BEE_IMG = new Image(); BEE_IMG.src = A("game_bee.webp");
const BASKET_IMG = new Image(); BASKET_IMG.src = A("game_basket.webp");
ROUTES.catch = () => {
  const older = S.older;
  let score = 0, running = false, spawnT = 0, elapsed = 0, bx = 0.5, flash = 0;
  const items = [], parts = [];
  const view = frame("Πιάσε τα φρούτα", "var(--orange)", older ? "Πιάσε τα φρούτα με το καλάθι. Πρόσεχε τις μέλισσες!" : "Πιάσε τα φρούτα με το καλάθι!");
  const hud = gameHud(view); hud.time(40); hud.score(0, "🧺");
  const panel = h("div", { class: "panel fill", style: "background:linear-gradient(#bfe6ff 0%,#e8f7ff 70%,#9ad77a 70%)" });
  view.append(h("p", { class: "muted center", style: "margin:0" }, "Σύρε το δάχτυλο δεξιά–αριστερά"), panel);
  const { cv } = gameCanvas(panel, (g, dim, dt) => {
    g.clearRect(0, 0, dim.w, dim.h);
    const size = Math.max(34, Math.min(52, dim.w / 9)), basketY = dim.h - size * 1.1, basketX = bx * dim.w;
    if (running) {
      elapsed += dt; spawnT -= dt;
      if (spawnT <= 0) {
        spawnT = Math.max(0.38, 0.85 - elapsed * 0.01);
        const bee = older && Math.random() < 0.25;
        items.push({ x: size / 2 + Math.random() * (dim.w - size), y: -size, vy: (120 + Math.random() * 80) * (1 + elapsed / 50), img: bee ? BEE_IMG : pickOne(FRUITS), bee, rot: Math.random() * 6 });
      }
    }
    g.textAlign = "center"; g.textBaseline = "middle";
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; it.y += it.vy * dt; it.rot += dt * (it.bee ? 10 : 1.5);
      if (it.y > dim.h + size) { items.splice(i, 1); continue; }
      if (running && it.y > basketY - size * 0.6 && it.y < basketY + size * 0.3 && Math.abs(it.x - basketX) < size * 1.1) {
        items.splice(i, 1);
        if (it.bee) { score = Math.max(0, score - 2); sfx.no(); flash = 0.35; burst(parts, it.x, it.y, "#ffc928"); }
        else { score++; note(N.C5 * (1 + (score % 8) * 0.12), 0.25); burst(parts, it.x, it.y, "#ff8a00"); }
        hud.score(score, "🧺"); continue;
      }
      g.save(); g.translate(it.x + (it.bee ? Math.sin(it.rot) * 10 : 0), it.y); g.rotate(it.bee ? 0 : Math.sin(it.rot) * 0.3);
      if (it.img.complete) g.drawImage(it.img, -size / 2, -size / 2, size, size); g.restore();
    }
    const bw = size * 2.1;
    if (BASKET_IMG.complete) g.drawImage(BASKET_IMG, basketX - bw / 2, basketY - bw * 0.55, bw, bw);
    if (flash > 0) { flash -= dt; g.fillStyle = `rgba(242,69,61,${flash})`; g.fillRect(0, 0, dim.w, dim.h); }
    drawParts(g, parts, dt);
  });
  const move = (e) => { const r = cv.getBoundingClientRect(); bx = Math.min(0.94, Math.max(0.06, (e.clientX - r.left) / r.width)); };
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); move(e); });
  cv.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "mouse") move(e); });
  startCard(panel, older ? "Πιάσε τα φρούτα με το καλάθι. Πρόσεχε τις μέλισσες, σου παίρνουν πόντους!" : "Σύρε το καλάθι και πιάσε όσα φρούτα μπορείς!", () => {
    running = true;
    countdown(40, hud, () => { running = false; finishGame("catch", score, 10, 20, `Μάζεψες ${score} φρούτα!`); });
  });
};

/* Simon: repeat the growing sequence of colours and notes */
ROUTES.simon = () => {
  const older = S.older;
  const PADS = [["var(--red)", N.C5, "🍓"], ["var(--blue)", N.E5, "🐳"], ["var(--yellow)", N.G5, "🌞"], ["var(--green)", N.C6, "🐸"]];
  let seq = [], pos = 0, accepting = false, best = 0;
  const view = frame("Θυμήσου τη σειρά", "var(--purple)", "Κοίτα ποια κουμπιά ανάβουν και πάτα τα με την ίδια σειρά!");
  const hud = gameHud(view, false); hud.score(0, "Σειρά:");
  const status = h("p", { class: "prompt" }, "Κοίτα και άκου…");
  const pads = PADS.map(([c, f, em], i) => {
    const b = h("button", { class: "pad", style: `--c:${c}`, "aria-label": `Κουμπί ${i + 1}` }, em);
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); press(i); });
    return b;
  });
  const panel = h("div", { class: "fill", style: "display:grid;place-items:center;position:relative;border-radius:26px" }, h("div", { class: "simon" }, pads));
  view.append(status, panel);
  let alive = true; onLeave(() => { alive = false; });
  const light = async (i, ms) => { pads[i].classList.add("lit"); note(PADS[i][1], ms / 1000 + 0.2); await sleep(ms); pads[i].classList.remove("lit"); };
  async function playSeq() {
    accepting = false; status.textContent = "Κοίτα και άκου…";
    await sleep(600);
    const ms = Math.max(older ? 260 : 380, (older ? 480 : 620) - seq.length * 15);
    for (const i of seq) { if (!alive) return; await light(i, ms); await sleep(120); }
    pos = 0; accepting = true; status.textContent = "Σειρά σου!";
  }
  function next() { seq.push(rnd(0, 3)); hud.score(seq.length - 1, "Σειρά:"); playSeq(); }
  async function press(i) {
    if (!accepting) return;
    light(i, 220);
    if (i !== seq[pos]) {
      accepting = false; sfx.no(); status.textContent = "Ωχ! Λάθος κουμπί";
      best = seq.length - 1; await sleep(700);
      finishGame("simon", best, older ? 4 : 3, older ? 7 : 5, `Θυμήθηκες ${best} στη σειρά!`);
      return;
    }
    pos++;
    if (pos >= seq.length) { accepting = false; hud.score(seq.length, "Σειρά:"); await sleep(250); sfx.ok(); await sleep(400); if (alive) next(); }
  }
  startCard(panel, "Κοίτα ποια κουμπιά ανάβουν και πάτα τα με την ίδια σειρά!", () => next());
};

/* ---------- 3D owl ---------- */
ROUTES.owl = () => {
  const hint = "Γύρνα τη Σοφούλα με το δάχτυλο! Με δύο δάχτυλα κάνεις ζουμ.";
  const view = frame("Σοφούλα 3D", "var(--red)", hint);
  say("Γεια! Είμαι η Σοφούλα σε τρεις διαστάσεις! " + hint);
  const mv = h("model-viewer", { src: A("owl.json"), alt: "Η Σοφούλα σε 3D", "camera-controls": true, "touch-action": "none", "auto-rotate": true, "auto-rotate-delay": "0", "rotation-per-second": "25deg", "shadow-intensity": "1", exposure: "1.05", "interaction-prompt": "none" });
  view.append(h("p", { class: "muted center", style: "margin:0;font-size:18px" }, hint), h("div", { class: "panel fill" }, mv));
};

render();
})();
</script>
